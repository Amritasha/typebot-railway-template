[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
PORT = "3000"
NODE_ENV = "production"

# Required — fill these after deploy
DATABASE_URL = ""
NEXTAUTH_URL = ""
NEXT_PUBLIC_VIEWER_URL = ""
ENCRYPTION_SECRET = ""
NEXTAUTH_SECRET = ""

# Access control
ADMIN_EMAIL = ""
DISABLE_SIGNUP = "false"

# SMTP (optional)
SMTP_USERNAME = ""
SMTP_PASSWORD = ""
SMTP_HOST = ""
SMTP_PORT = "587"
SMTP_SECURE = "false"
NEXT_PUBLIC_SMTP_FROM = ""

# S3 file storage (optional)
S3_ACCESS_KEY = ""
S3_SECRET_KEY = ""
S3_BUCKET = ""
S3_REGION = ""
S3_ENDPOINT = ""

# OAuth — GitHub (optional)
GITHUB_CLIENT_ID = ""
GITHUB_CLIENT_SECRET = ""

# OAuth — Google (optional)
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""

# OAuth — GitLab (optional)
GITLAB_CLIENT_ID = ""
GITLAB_CLIENT_SECRET = ""
GITLAB_BASE_URL = ""

# OAuth — Facebook (optional)
FACEBOOK_CLIENT_ID = ""
FACEBOOK_CLIENT_SECRET = ""

# OAuth — Microsoft Entra (optional)
MICROSOFT_ENTRA_TENANT_ID = ""
MICROSOFT_ENTRA_CLIENT_ID = ""
MICROSOFT_ENTRA_CLIENT_SECRET = ""

# OAuth — Custom provider (optional)
CUSTOM_OAUTH_CLIENT_ID = ""
CUSTOM_OAUTH_CLIENT_SECRET = ""
CUSTOM_OAUTH_WELL_KNOWN_URL = ""
CUSTOM_OAUTH_DISPLAY_NAME = ""
CUSTOM_OAUTH_REQUIRED_GROUPS = ""
CUSTOM_OAUTH_USER_ID_PATH = ""
CUSTOM_OAUTH_USER_NAME_PATH = ""
CUSTOM_OAUTH_USER_EMAIL_PATH = ""
CUSTOM_OAUTH_USER_IMAGE_PATH = ""
